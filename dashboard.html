
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="logo">🎓 College Admission Portal</div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="admission.html">Admission</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
</nav>


<section class="dashboard">

    <h1>Student Dashboard</h1>

    <div class="dashboard-container">

        <!-- Student Profile -->
        <div class="dashboard-card">
            <h3>👤 Student Profile</h3>

            <p>Name: <span id="studentName">-</span></p>

            <p>Email: <span id="studentEmail">-</span></p>
        </div>


        <!-- Selected Course -->
        <div class="dashboard-card">
            <h3>📚 Selected Course</h3>

            <p id="selectedCourse">-</p>
        </div>


        <!-- Application Status -->
        <div class="dashboard-card">
            <h3>📄 Application Status</h3>

            <p id="applicationStatus" class="pending">
                Pending
            </p>
        </div>


        <!-- Admission Status -->
        <div class="dashboard-card">
            <h3>🎓 Admission Status</h3>

            <p id="admissionStatus">
                Under Review
            </p>
        </div>

    </div>


    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</section>


<footer>
    <p>© 2026 College Admission Portal | All Rights Reserved</p>
</footer>


<script src="script.js"></script>

</body>
</html>
