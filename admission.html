<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="logo">🎓 College Admission Portal</div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="admission.html">Admission Form</a></li>
    </ul>
</nav>


<section class="admission-form">

    <h1>College Admission Application Form</h1>

    <form id="admissionForm">

        <h2>Personal Details</h2>

        <label>Student Name</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Date of Birth</label>
        <input type="date" required>

        <label>Gender</label>
        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        
        <label>Mobile Number</label>
<input type="tel" placeholder="Enter mobile number" required>

<label>EMIS Number</label>
<input type="text" placeholder="Enter your EMIS Number" required>


        <h2>Educational Details</h2>

        <label>Previous School / College</label>
        <input type="text" placeholder="Enter school or college name">

        <label>Percentage / Marks</label>
        <input type="text" placeholder="Enter percentage">


        
        <h2>Course Selection</h2>

<label>Select Course</label>
<select required>
    <option value="">Select Course</option>
    <option>BCA</option>
    <option>B.Sc Computer Science</option>
    <option>B.Sc Mathematics</option>
    <option>B.Sc Physics</option>
    <option>BBA</option>
    <option>B.Com</option>
    <option>BA English</option>
    <option>BA Tamil</option>

        </select>


        <label>Address</label>
        <textarea placeholder="Enter your address"></textarea>


        
        <h2>Document Upload</h2>



<label>Upload Passport Size Photo</label>
<input type="file" accept="image/*" required>

<label>Upload Aadhaar Card</label>
<input type="file" accept=".pdf,.jpg,.jpeg,.png" required>

<label>Upload 10th Marksheet</label>
<input type="file" accept=".pdf,.jpg,.jpeg,.png" required>

<label>Upload 12th Marksheet</label>
<input type="file" accept=".pdf,.jpg,.jpeg,.png" required>

<label>Upload Community Certificate</label>
<input type="file" accept=".pdf,.jpg,.jpeg,.png" required>

<label>Upload Income Certificate</label>
<input type="file" accept=".pdf,.jpg,.jpeg,.png" required>

<label>Upload Transfer Certificate (TC)</label>
<input type="file" accept=".pdf,.jpg,.jpeg,.png" required>

<h2>Payment Details</h2>

<label>Application Fee</label>
<input type="text" value="₹500" readonly>

<label>Select Payment Method</label>

<select required>
    <option value="">Select Payment Method</option>
    <option>UPI</option>
    <option>Google Pay (GPay)</option>
    <option>PhonePe</option>
</select>

<label>Transaction ID</label>
<input type="text" placeholder="Enter Transaction ID" required>


<button type="submit">Submit Application</button>
    </form>

</section>


<footer>
    <p>© 2026 College Admission Portal | All Rights Reserved</p>
</footer>


<script src="script.js"></script>

</body>
</html>
